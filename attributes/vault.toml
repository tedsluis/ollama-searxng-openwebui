[globals]
cpuPinList = "0,2,4,6,8,10,12,13,14,15,16,17,18,19"
ollamaPort = "11434"
searxngPort = "8112"
openwebuiPort = "8080"

[components.ollama]
# renovate: datasource=docker depName=docker.io/ollama/ollama versioning=semver
containerTag = "0.40.14"
modelsPath = "/usr/share/ollama/.ollama"
gpuOverhead = "134217728"
keepAlive = "15m"
contextLength = "16384"
kvCacheType = "q8_0"
cpuPinList = "0,2,4,6,8,10,12,13,14,15,16,17,18,19"

[components.searxng]
# renovate: datasource=docker depName=docker.io/searxng/searxng versioning=regex:^(?<major>\d{4})\.(?<minor>\d{1,2})\.(?<patch>\d{1,2})-[0-9a-f]+$
containerTag = "2026.11.2-d138f443b"

[components.open-webui]
# renovate: datasource=docker depName=ghcr.io/open-webui/open-webui versioning=semver
containerTag = "v0.13.4"
dataPath = "/opt/open-webui"

[components.renovate]
# renovate: datasource=docker depName=ghcr.io/renovatebot/renovate versioning=semver
containerTag = "44.253.4"
githubRepo = "tedsluis/ollama-searxng-openwebui"

[components.monitoring]
# Onder dit GPU-aandeel van een geladen model volgt een melding
minGpuPercent = "40"
# Vast testmodel voor de dagelijkse meting, bij voorkeur een dat volledig in VRAM past
perfModel = "gpt-oss:20b"
# Ondergrens in tokens/s: neem ongeveer de helft van de gemeten waarde
perfMinTps = "3"
